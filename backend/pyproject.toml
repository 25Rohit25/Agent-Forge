[project]
name = "agentforge-backend"
version = "1.0.0"
description = "AgentForge - Autonomous Agentic AI Developer Workspace Backend"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "pgvector>=0.2.5",
    "redis>=5.0.4",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.7",
    "openai>=1.30.0",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.2",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
